listening-port=3478
tls-listening-port=443
fingerprint
use-auth-secret
static-auth-secret=${TURN_SECRET}
realm=${TURN_REALM}
total-quota=1200
bps-capacity=0
no-loopback-peers
no-multicast-peers
stale-nonce=600
cert=/etc/coturn/tls/fullchain.pem
pkey=/etc/coturn/tls/privkey.pem
# In production, place coturn behind a hardened public load balancer
# or expose this service directly with the required TLS certificates.
