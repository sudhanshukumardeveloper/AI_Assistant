services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: communication
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d communication"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  signaling:
    build:
      context: ../services/signaling
    environment:
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      REDIS_URL: redis://redis:6379
      SIGNALING_SECRET: ${SIGNALING_SECRET:?Set SIGNALING_SECRET in docker/.env}
      PORT: 4001
    depends_on:
      redis:
        condition: service_healthy
    ports: ["4001:4001"]

  sfu:
    build:
      context: ../services/sfu
    environment:
      SIGNALING_SECRET: ${SIGNALING_SECRET:-development-secret-change-me}
      PORT: 4100
      RTC_ANNOUNCED_IP: ${RTC_ANNOUNCED_IP:-127.0.0.1}
      RTC_MIN_PORT: 40000
      RTC_MAX_PORT: 49999
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "4100:4100"
      - "40000-49999:40000-49999/udp"

  coturn:
    image: coturn/coturn:4.6
    command: ["-c", "/etc/coturn/turnserver.conf"]
    environment:
      TURN_SECRET: ${TURN_SECRET:-development-secret-change-me}
      TURN_REALM: ${TURN_REALM:-localhost}
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./coturn.conf:/etc/coturn/turnserver.conf:ro

volumes:
  pgdata:
