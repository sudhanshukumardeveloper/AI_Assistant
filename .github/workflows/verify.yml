name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run build

  services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [signaling, sfu]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
        working-directory: services/${{ matrix.service }}
      - run: npm run typecheck
        working-directory: services/${{ matrix.service }}
